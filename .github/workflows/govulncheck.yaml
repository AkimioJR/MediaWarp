name: Go Vulnerability Check

on:
  push:
    paths:
      - "**/*.go"
      - "**/go.mod"
      - "**/go.sum"
      - ".github/workflows/govulncheck.yaml"
  pull_request:
    paths:
      - "**/*.go"
      - "**/go.mod"
      - "**/go.sum"
      - ".github/workflows/govulncheck.yaml"

permissions:
  contents: read

jobs:
  govulncheck:
    name: Scan Go dependencies for vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: "**/go.sum"

      - name: Install govulncheck
        shell: bash
        run: |
          set -euo pipefail

          tool_dir="${RUNNER_TEMP}/go-tools"
          mkdir -p "${tool_dir}"
          GOBIN="${tool_dir}" go install golang.org/x/vuln/cmd/govulncheck@latest
          echo "${tool_dir}" >> "${GITHUB_PATH}"

      - name: Scan all Go modules
        shell: bash
        run: |
          set -euo pipefail

          module_files=()
          while IFS= read -r -d '' module_file; do
            module_files+=("${module_file}")
          done < <(git ls-files -z ':(glob)**/go.mod')

          if (( ${#module_files[@]} == 0 )); then
            echo "No Go modules found."
            exit 0
          fi

          for module_file in "${module_files[@]}"; do
            module_dir="$(dirname "${module_file}")"
            echo "::group::govulncheck ${module_dir}"
            (
              cd "${module_dir}"
              govulncheck ./...
            )
            echo "::endgroup::"
          done
