name: Go Vet

on:
  push:
    paths:
      - "**/*.go"
      - "**/go.mod"
      - "**/go.sum"
      - ".github/workflows/go-vet.yaml"
  pull_request:
    paths:
      - "**/*.go"
      - "**/go.mod"
      - "**/go.sum"
      - ".github/workflows/go-vet.yaml"

permissions:
  contents: read

jobs:
  govet:
    name: Run go vet
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: "**/go.sum"

      - name: Vet all Go modules
        shell: bash
        run: |
          set -euo pipefail

          module_files=()
          while IFS= read -r -d '' module_file; do
            module_files+=("${module_file}")
          done < <(git ls-files -z ':(glob)**/go.mod')

          if (( ${#module_files[@]} == 0 )); then
            echo "No Go modules found."
            exit 0
          fi

          for module_file in "${module_files[@]}"; do
            module_dir="$(dirname "${module_file}")"
            echo "::group::go vet ${module_dir}"
            (
              cd "${module_dir}"
              go vet ./...
            )
            echo "::endgroup::"
          done
