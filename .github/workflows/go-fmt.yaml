name: Go Format

on:
  push:
    paths:
      - "**/*.go"
      - "**/go.mod"
      - "**/go.sum"
      - ".github/workflows/go-fmt.yaml"
  pull_request:
    paths:
      - "**/*.go"
      - "**/go.mod"
      - "**/go.sum"
      - ".github/workflows/go-fmt.yaml"

permissions:
  contents: read

jobs:
  gofmt:
    name: Check Go formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Check formatting
        shell: bash
        run: |
          set -euo pipefail

          go_files=()
          while IFS= read -r -d '' go_file; do
            go_files+=("${go_file}")
          done < <(git ls-files -z ':(glob)**/*.go')

          if (( ${#go_files[@]} == 0 )); then
            echo "No Go files found."
            exit 0
          fi

          unformatted="$(gofmt -l "${go_files[@]}")"
          if [[ -n "${unformatted}" ]]; then
            echo "The following Go files are not formatted:"
            printf '%s\n' "${unformatted}"
            echo "Run gofmt -w on these files and commit the changes."
            exit 1
          fi
